<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YOMU">
<title>YOMU</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Manrope:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* układ: jedna kolumna jak fiszka, duży znak na środku, sterowanie pod kciukiem */
  --bg:#121828;
  --panel:#1a2137;
  --panel2:#232b47;
  --line:#303a5c;
  --text:#efe9dc;
  --muted:#98a0bb;
  --accent:#ef5b3a;
  --accent-ink:#1d0b05;
  --good:#7fc46a;
  --bad:#ff5f78;
  --known:#d9ae4f;
  --learn:#6874a6;
  --ghost:#2c3555;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Manrope","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.45;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.app{position:relative;z-index:1;width:100%;max-width:560px;min-height:100%;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
b,strong{font-weight:800}
.jp{font-family:var(--f-kana)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;user-select:none}
.logo b{letter-spacing:.2em;font-size:19px}
.logo span{font-family:var(--f-kana);color:var(--accent);font-size:21px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip strong{color:var(--text)}
.chip.hot{border-color:var(--accent)}
.chip.hot strong{color:var(--accent)}
button.chip:hover{border-color:var(--muted)}
.goal{height:4px;background:var(--panel);border-radius:2px;overflow:hidden;margin-top:-6px}
.goal i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.goal.done i{background:var(--good)}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--panel);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tabs button{padding:9px 2px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}

main{display:flex;flex-direction:column;gap:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;flex:1 1 auto}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.seg .jp{margin-left:4px}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;transition:border-color .15s}
.card.ok{border-color:var(--good)}
.card.ok .big{color:var(--good)}
.card.no{border-color:var(--bad)}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.card.shake{animation:none}.goal i{transition:none}}
.badge{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px;font-weight:800}
.speak{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.speak:hover{background:var(--panel2);color:var(--text)}
.big{font-family:var(--f-kana);font-weight:600;font-size:clamp(108px,32vw,164px);line-height:1.05;text-align:center;min-height:1.05em;transition:color .15s}
.big.word{font-size:clamp(46px,13vw,80px);line-height:1.2;padding-top:10px;word-break:keep-all}
.big.roma{font-family:var(--f-ui);font-weight:800;font-size:clamp(64px,20vw,104px);letter-spacing:.02em}
.big.listen{display:grid;place-items:center;font-size:clamp(108px,32vw,164px)}
.listen-big{width:1em;height:1em;max-width:150px;max-height:150px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.listen-big:hover{border-color:var(--muted)}
.listen-big svg{width:42%;height:42%}
.hint{color:var(--muted);min-height:1.45em;font-size:15px;text-align:center;max-width:42ch}
.hint b{color:var(--text)}
.hint .jp{font-size:1.2em;color:var(--text)}
.mnemo{font-size:14px;color:var(--muted);text-align:center;max-width:44ch;background:var(--panel2);border-radius:12px;padding:9px 13px;line-height:1.5}
.mnemo:empty{display:none}
.mnemo .jp{font-size:1.3em;color:var(--text);margin-right:4px}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:13px;margin-left:4px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.answer{width:100%}
.answer input,.field{width:100%;font:inherit;font-size:28px;font-weight:600;letter-spacing:.06em;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
.field{font-size:20px;padding:10px}
.answer input:focus,.field:focus{border-color:var(--learn)}
.card.ok .answer input{border-color:var(--good)}
.card.no .answer input{border-color:var(--bad)}
.answer input::placeholder,.field::placeholder{color:#4d5779;font-weight:400;letter-spacing:0;font-size:18px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choices button{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font-family:var(--f-kana);font-size:36px;font-weight:600;line-height:1.2;min-height:76px}
.choices button.roma{font-family:var(--f-ui);font-size:24px;font-weight:800}
.choices button:hover{border-color:var(--muted)}
.choices button .n{position:absolute;top:6px;left:9px;font-family:var(--f-ui);font-size:11px;font-weight:600;color:#59638a}
.choices button.right{border-color:var(--good);color:var(--good);background:rgba(127,196,106,.1)}
.choices button.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,95,120,.08)}

.help{margin:0;font-size:13px;color:var(--muted);text-align:center}
.help a{color:var(--muted)}
#banner{display:flex;flex-direction:column;gap:8px}
#banner:empty{display:none}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.note .jp{font-size:1.15em}

.sprint-bar{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.sprint-bar .score{font-size:28px;font-weight:800}
.sprint-bar .time{font-size:22px;font-weight:800;color:var(--accent)}
.sprint-bar small{font-size:13px;color:var(--muted);font-weight:600;margin-right:6px}
.timebar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--accent);width:100%}
.result{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* plan na dziś */
.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plan.ok{border-color:rgba(127,196,106,.55)}
.plan-head{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:800;font-size:14px;letter-spacing:.04em;text-align:left}
.plan-head > span:first-child{flex:1}
.pcount{font-variant-numeric:tabular-nums;color:var(--accent);font-size:15px}
.chev{color:var(--muted);transition:transform .2s}
.plan-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hanko{font-family:var(--f-kana);font-weight:600;color:var(--accent);border:2px solid var(--accent);border-radius:6px;padding:0 5px;font-size:15px;line-height:1.35;transform:rotate(-6deg)}
.plan-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li{display:flex;align-items:center;gap:10px;font-size:14px;min-height:34px}
.plan li .plabel{flex:1}
.plan li small{color:var(--muted);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.pcheck{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.plan li.got .pcheck{background:var(--good);border-color:var(--good);color:var(--bg)}
.plan li.got .plabel{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(152,160,187,.5)}
.week{display:flex;gap:6px}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wday i{display:block;width:100%;max-width:34px;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.wday.done i{background:var(--good);border-color:var(--good)}
.wday.today small{color:var(--text)}
.wday.today i{border-color:var(--muted)}
.chip.ok{border-color:var(--good)}
.chip.ok strong{color:var(--good)}

.sycode{font-family:ui-monospace,Consolas,monospace;font-size:16px;letter-spacing:.03em;color:var(--accent);word-break:break-all}

/* arkusz do druku */
#printsheet{display:none}
@media print{
  @page{size:A4 portrait;margin:11mm}
  :root{color-scheme:light}
  html,body{background:#fff!important;height:auto}
  body{display:block;color:#000}
  .app,.petals,.toast,dialog{display:none!important}
  #printsheet{display:block;font-family:var(--f-ui);color:#000}
  .ps-head{display:flex;gap:6mm;align-items:baseline;justify-content:space-between;font-size:10pt;margin-bottom:4mm;border-bottom:.3mm solid #000;padding-bottom:2mm}
  .ps-head .jp{color:#c33}
  .ps-row{display:flex;align-items:center;break-inside:avoid;margin-bottom:2.2mm}
  .ps-lab{width:9mm;font-size:8.5pt;font-weight:800;color:#555}
  .ps-cell{width:17.5mm;height:17.5mm;border:.3mm solid #888;margin-left:-.3mm;flex:none}
  .ps-cell svg{width:100%;height:100%;display:block}
  .ps-guide{stroke:#bbb;stroke-width:.8;stroke-dasharray:3 3}
  .ps-model{fill:none;stroke:#000;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .ps-trace{fill:none;stroke:#c9c9c9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .ps-num{font:800 11px var(--f-ui);fill:#c33;text-anchor:middle;dominant-baseline:central}
  .ps-font{font-family:var(--f-kana);font-size:84px;fill:#000;text-anchor:middle;dominant-baseline:central}
  .ps-font.ps-light{fill:#c9c9c9}
  .ps-roma{font:800 34px var(--f-ui);fill:#000;text-anchor:middle;dominant-baseline:central}
  .ps-foot{margin-top:4mm;font-size:8pt;color:#555}
  .ps-fill{color:#555}
}

/* zeszyt */
.bookcard{gap:12px}
.bkboards{display:flex;gap:10px;justify-content:center;width:100%}
.board.half{width:min(46%,180px)}
.bksec{width:100%;display:flex;flex-direction:column;gap:8px}
.bksec h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bksec p{margin:0;font-size:14px;color:var(--muted)}
.bksec p b,.bksec p .jp{color:var(--text)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{width:58px;height:58px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.stepplus{color:var(--muted);font-weight:800;padding:0 2px}
.s-step-old{fill:none;stroke:var(--text);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.s-step-new{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.s-step-dot{fill:var(--accent)}
.s-step-n{font:800 13px var(--f-ui);fill:var(--muted)}
.exw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exw li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;font-size:14px;background:var(--panel2);border-radius:10px;padding:6px 10px}
.exw li .jp{font-size:22px}
.exw li b{color:var(--text)}
.exw li span:last-child{color:var(--muted)}
.exw li.dim{opacity:.5}
.exw mark{background:none;color:var(--accent)}
.row.bkrow{grid-template-columns:1fr}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cell.pp{position:relative}
.cell.pp::after{content:"✎";position:absolute;top:1px;right:3px;font-size:10px;color:var(--known)}
.btn[disabled]{opacity:.35;cursor:default}

/* pisanie */
.board{position:relative;width:min(100%,320px);aspect-ratio:1;border-radius:16px;background:var(--bg);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.board.small{width:min(100%,220px)}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s-grid{stroke:#262f4c;stroke-width:.6;stroke-dasharray:2 2}
.s-font{font-family:var(--f-kana);font-size:84px;font-weight:600;fill:var(--ghost);text-anchor:middle;dominant-baseline:central}
.s-guide,.s-demo,.s-user,.s-tmp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-guide{stroke:var(--ghost);stroke-width:5}
.s-demo{stroke:var(--accent);stroke-width:4.2}
.s-user{stroke:var(--text);stroke-width:4.6}
.s-user.ok{stroke:var(--good)}
.s-user.bad{stroke:var(--bad)}
.s-tmp{stroke:none}
.snum{font:800 7.5px var(--f-ui);fill:var(--accent);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:2.6px}
.namek{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.namek button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;min-width:54px;text-align:center}
.namek button:hover{border-color:var(--muted)}
.namek .k{display:block;font-family:var(--f-kana);font-size:34px;font-weight:600;line-height:1.2}
.namek .r{display:block;font-size:11px;color:var(--muted);font-weight:600;min-height:1.2em}
.namek .dot{align-self:center;font-family:var(--f-kana);font-size:28px;color:var(--muted)}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.stat strong{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.l0{border-top-color:var(--line)}
.stat.l1{border-top-color:var(--learn)}
.stat.l2{border-top-color:var(--known)}
.stat.l3{border-top-color:var(--good)}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:800}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 8px}
.row.off .cells{opacity:.45}
.tog{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;justify-self:center}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{min-width:44px;padding:3px 5px 2px;border-radius:8px;text-align:center;background:var(--panel2);border-bottom:3px solid transparent}
.cell:hover{background:var(--line)}
.cell .k{display:block;font-family:var(--f-kana);font-size:22px;font-weight:600;line-height:1.25}
.cell .r{display:block;font-size:10px;color:var(--muted);font-weight:600}
.cell.l1{border-bottom-color:var(--learn)}
.cell.l2{border-bottom-color:var(--known)}
.cell.l3{border-bottom-color:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel .line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel p{margin:0;font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:84px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;word-break:break-all}
.mixrow{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.mixrow .jp{font-size:24px;color:var(--text)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ach .g{font-family:var(--f-kana);font-size:26px;font-weight:600;width:34px;text-align:center;color:var(--accent);flex:none}
.ach strong{font-size:13px;display:block;line-height:1.25}
.ach small{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.ach.off{opacity:.55}
.ach.off .g{color:var(--line)}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:0;width:min(92vw,420px);max-height:92vh}
dialog::backdrop{background:rgba(8,11,20,.72)}
.dlg{position:relative;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.dlg .big{font-size:96px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:min(92vw,460px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:5}
.toast .jp{font-size:1.15em}

.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-24px;width:13px;height:9px;background:#f4b3c6;border-radius:13px 0 13px 0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}}

@media (max-width:420px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .tabs button{font-size:12.5px}
  .seg button{padding:7px 5px;font-size:12.5px}
  .cell{min-width:40px}
}
</style>
</head>

const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

function buildItems(){
  const items = {}, rows = {h:[], k:[]};
  for (const [rid, def, grp] of HIRA_ROWS){
    for (const sc of ['h','k']){
      const list = [];
      def.split(' ').forEach(p => {
        const [kana, ro] = p.split(':');
        const ch = sc === 'h' ? kana : toKata(kana);
        const id = sc + ':' + ch;
        items[id] = {id, sc, ch, ro: ro.split('/'), row: rid};
        list.push(id);
      });
      rows[sc].push({id: rid, grp, items: list});
    }
  }
  return {items, rows};
}

// wpisywanie znaku: ok / czekaj (może jeszcze wyjść coś sensownego) / źle (as = znak, który wpisałeś zamiast tego)
function judgeTyped(it, v){
  if (it.ro.includes(v)) return {res:'ok'};
  if (it.ro.some(a => a.startsWith(v))) return {res:'wait'};
  if (ALL_RO.some(r => r !== v && r.startsWith(v))) return {res:'wait'};
  return {res:'wrong', as: ROMA[it.sc][v] || null};
}

// słowo → jednostki do sprawdzania; każda ma listę dozwolonych zapisów
function tokenize(word){
  const raw = [], chars = [...word];
  for (let i = 0; i < chars.length; i++){
    let c = chars[i];
    if (c === 'っ' || c === 'ッ'){ raw.push({gem:true}); continue; }
    if (c === 'ー'){ raw.push({long:true}); continue; }
    const n = chars[i+1];
    if (n && 'ゃゅょャュョ'.includes(n)){ c += n; i++; }
    const ro = KMAP[c];
    if (!ro) throw new Error('Brak znaku ' + c + ' w ' + word);
    raw.push({k:c, v:ro.slice()});
  }
  const out = [];
  for (let i = 0; i < raw.length; i++){
    const u = raw[i];
    if (u.gem){
      const nx = raw[i+1];
      const v = [];
      nx.v.forEach(x => { v.push(x[0] + x); if (x.startsWith('ch')) v.push('t' + x); });
      out.push({k: (word.includes('ッ') ? 'ッ' : 'っ') + nx.k, base: nx.k, v});
      i++;
      continue;
    }
    if (u.long){
      const prev = out[out.length-1];
      out.push({k:'ー', v:[prev.v[0].slice(-1), '-', '']});
      continue;
    }
    if ((u.k === 'う' || u.k === 'ウ') && out.length && /o$/.test(out[out.length-1].v[0])){
      out.push({k:u.k, v:['u','o','']});
      continue;
    }
    out.push(u);
  }
  return out;
}
const NONE = 0, PREFIX = 1, FULL = 2;
function matchUnits(units, s){
  const memo = new Map();
  function rec(ui, si){
    const key = ui + ',' + si;
    if (memo.has(key)) return memo.get(key);
    let best = NONE;
    if (ui === units.length) best = si === s.length ? FULL : NONE;
    else {
      if (si === s.length) best = PREFIX;
      for (const v of units[ui].v){
        if (s.startsWith(v, si)){
          const r = rec(ui + 1, si + v.length);
          if (r > best) best = r;
          if (best === FULL) break;
        } else if (si < s.length && v.startsWith(s.slice(si))){
          if (best < PREFIX) best = PREFIX;
        }
      }
    }
    memo.set(key, best);
    return best;
  }
  return rec(0, 0);
}
const canon = units => units.map(u => u.v[0]).join('');
const normalize = s => s.toLowerCase().replace(/[\s'’]/g, '').replace(/[āâ]/g,'aa').replace(/[īî]/g,'ii').replace(/[ūû]/g,'uu').replace(/[ēê]/g,'ee').replace(/[ōô]/g,'ou');

function level(st){
  if (!st || !st.n) return 0;
  const acc = st.ok / st.n;
  if (st.streak >= 6 && acc >= 0.85) return 3;
  if (st.streak >= 3) return 2;
  return 1;
}

// powtórki w czasie: dobra odpowiedź w terminie wydłuża przerwę 1 → 3 → 7 → 14 → 30 → 60 → 120 dni
const DAY = 864e5;
const IVS = [1, 3, 7, 14, 30, 60, 120];
function dayStart(t){ const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(t, n){ const d = new Date(dayStart(t)); d.setDate(d.getDate() + n); return d.getTime(); }
function srs(st, ok, now = Date.now()){
  if (!ok){ st.iv = 0; st.due = now; return; }
  if (!st.iv){ st.iv = 1; st.due = addDays(now, 1); return; }
  if (now >= st.due){
    st.iv = IVS.find(x => x > st.iv) || st.iv * 2;
    st.due = addDays(now, st.iv);
  }
}
const isDue = (st, now = Date.now()) => !!(st && st.n && st.due != null && st.due <= now);
function migrateStat(st, now = Date.now()){
  if (st.iv == null){ const lv = level(st); st.iv = lv === 3 ? 3 : lv === 2 ? 1 : 0; st.due = now; }
  return st;
}

function weight(st, now = Date.now()){
  if (!st || !st.n) return 4;
  const acc = st.ok / st.n;
  const lv = level(st);
  let w = 1 + (1 - acc) * 5;
  if (lv === 3) w *= 0.25; else if (lv === 2) w *= 0.6;
  if (st.streak === 0) w += 2;

function plPhones(w){
  const V = 'aeiouyóąę';
  const isV = c => !!c && V.includes(c);
  const single = {k:'k',g:'g',s:'s',z:'z',t:'t',d:'d',n:'n',h:'h',f:'f',b:'b',p:'p',m:'m',r:'r',l:'r',w:'v',v:'v','ł':'w',j:'j',c:'ts','ć':'ch','ś':'sh','ź':'zh','ż':'zh','ń':'ny',q:'k'};

    if ((m = rest.match(/^(dż|dź|dz|ch|cz|sz|rz)/))){
      ph.push({c: {'dż':'dzh','dź':'dzh',dz:'dz',ch:'h',cz:'ch',sz:'sh',rz:'zh'}[m[1]], rz: m[1] === 'rz'});

      else if (ch === 'ę'){ ph.push({v:'e'}); if (i + 1 < w.length) ph.push({c:'n'}); }

    }
    i++;
  }

  const VL = ['k','p','t','s','sh','ch','ts','h','f'];
  ph.forEach((p, k) => {

function plWordToKana(w){

function judgeStrokes(ref, user, tol = 26){
  const d = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  const res = [];
  const n = Math.max(ref.length, user.length);
  for (let i = 0; i < n; i++){
    const r = ref[i], u = user[i];
    if (!u){ res.push('missing'); continue; }
    if (!r){ res.push('extra'); continue; }
    const a = u[0], b = u[u.length - 1];
    if (d(a, r[0]) < tol && d(b, r[1]) < tol) res.push('ok');
    else if (d(a, r[1]) < tol && d(b, r[0]) < tol) res.push('dir');
    else res.push('pos');
  }
  return res;
}

function mergeState(a, b){
  if (!b || b.v !== 1) return a;
  const out = JSON.parse(JSON.stringify(a));
  const A = k => a[k] || {}, B = k => b[k] || {};

  const mergeStats = (X, Y) => { const r = {}; new Set([...Object.keys(X), ...Object.keys(Y)]).forEach(k => { r[k] = pickStat(X[k], Y[k]); }); return r; };
  const maxMap = (X, Y) => { const r = {...X}; for (const k in Y) r[k] = Math.max(r[k] || 0, Y[k] || 0); return r; };
  out.stats = mergeStats(A('stats'), B('stats'));
  out.wstats = mergeStats(A('wstats'), B('wstats'));
  out.unlocked = {};
  ['h','k'].forEach(sc => { out.unlocked[sc] = [...new Set([...(A('unlocked')[sc] || []), ...(B('unlocked')[sc] || [])])]; });
  out.intro = {...B('intro'), ...A('intro')};
  out.days = maxMap(A('days'), B('days'));
  out.best = maxMap(A('best'), B('best'));
  out.tally = maxMap(A('tally'), B('tally'));
  out.paper = maxMap(A('paper'), B('paper'));
  out.ach = {...A('ach')};
  for (const k in B('ach')) out.ach[k] = Math.min(out.ach[k] || Infinity, B('ach')[k]);
  // pomyłki znaku bierzemy z urządzenia, którego statystyki tego znaku wygrały
  out.mix = {};
  new Set([...Object.keys(A('mix')), ...Object.keys(B('mix'))]).forEach(id => {
    const w = out.stats[id];
    const fromB = w && w === B('stats')[id] && w !== A('stats')[id];
    const m = w ? (fromB ? B('mix')[id] : A('mix')[id]) : (A('mix')[id] || B('mix')[id]);
    if (m && Object.keys(m).length) out.mix[id] = {...m};
  });
  const pa = a.plan || {done:{}}, pb = b.plan || {done:{}};
  out.plan = {since: [pa.since, pb.since].filter(Boolean).sort()[0], done: {...pb.done, ...pa.done}, cur: pa.cur || null};
  if (pb.cur && (!pa.cur || pb.cur.day > pa.cur.day)) out.plan.cur = pb.cur;
  else if (pb.cur && pa.cur && pb.cur.day === pa.cur.day) out.plan.cur = {...pa.cur, got: {...pb.cur.got, ...pa.cur.got}};

// dni sprzed wprowadzenia planu liczą się po staremu (co najmniej 10 odpowiedzi)
function dayDone(k){ return !!S.plan.done[k] || (k < S.plan.since && (S.days[k] || 0) >= DAY_MIN); }
function todayStat(){
  const d = dayKey();
  if (!S.dstat || S.dstat.day !== d) S.dstat = {day:d, nw:0, wr:0, wd:0, ls:0, rows:0};
  return S.dstat;
}
function availableWords(){
  return scripts().reduce((n, sc) => n + (sc === 'h' ? [...WORDS_H, ...PHRASES_H] : WORDS_K).filter(w => wordOk({w:w[0], sc})).length, 0);
}
function unseenIds(){
  return poolFor(scripts(), false).filter(id => !S.intro[id] && !(S.stats[id] && S.stats[id].n));
}
// zadania ustalane raz na dzień, żeby plan nie zmieniał się w trakcie
function ensurePlan(){
  const d = dayKey();
  if (S.plan.cur && S.plan.cur.day === d) return S.plan.cur;
  const tasks = [];
  const due = dueIds().length;
  if (due) tasks.push({id:'rev', n:due});
  tasks.push({id:'goal'});
  const unseen = unseenIds().length;
  if (unseen) tasks.push({id:'new', n:Math.min(5, unseen)});
  else if (suggestion()) tasks.push({id:'row'});
  tasks.push({id:'write', n:3});
  if (availableWords() >= 5) tasks.push({id:'words', n:10});
  if (jaVoice) tasks.push({id:'listen', n:10});
  const cur = {day:d, tasks, got:{}};
  S.plan.cur = cur;
  tasks.forEach(t => { if (taskState(t).done) cur.got[t.id] = 1; });
  save();
  return cur;
}
function taskState(t){
  const ds = todayStat();
  const prog = (have, need) => ({done: have >= need, txt: `${Math.min(have, need)}/${need}`});
  switch (t.id){
    case 'rev': { const left = dueIds().length; return {done: !left, txt: left ? `zostało ${left}` : '', label: `Powtórz zaległe znaki (${t.n})`}; }
    case 'goal': return {...prog(S.days[dayKey()] || 0, S.goal), label: `Odpowiedz ${S.goal} razy`};
    case 'new': return {...prog(ds.nw, t.n), label: `Poznaj ${t.n} ${plural(t.n, 'nowy znak', 'nowe znaki', 'nowych znaków')}`};
    case 'row': return {done: ds.rows >= 1, txt: '', label: 'Dodaj następny rząd znaków'};
    case 'write': return {...prog(ds.wr, t.n), label: `Napisz ${t.n} znaki (w zeszycie albo na ekranie)`};
    case 'words': return {...prog(ds.wd, t.n), label: `Przeczytaj ${t.n} słów`};
    case 'listen': return {...prog(ds.ls, t.n), label: `Ze słuchu: ${t.n} dobrych odpowiedzi`};
  }
  return {done: true, txt: '', label: ''};
}
let planOpen = null;
function planCheck(){
  const p = ensurePlan();
  p.tasks.forEach(t => {
    if (p.got[t.id]) return;
    const s = taskState(t);

}

/* ---------- wzory kresek (KanjiVG) ---------- */
const STROKES = {};
let kvgCache = {};
try { kvgCache = JSON.parse(localStorage.getItem('yomu.kvg')) || {}; } catch (e) {}
function kvgUrls(ch){
  const hex = ch.codePointAt(0).toString(16).padStart(5, '0');
  return [`https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex}.svg`, `https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`];
}
function parseKvg(txt){
  const out = [];
  for (const m of txt.matchAll(/<path\b[^>]*>/g)){
    const tag = m[0];
    const id = tag.match(/\bid="kvg:[0-9a-f]+-s(\d+)"/i);
    const d = tag.match(/\sd="([^"]+)"/);
    if (id && d) out.push([+id[1], d[1]]);
  }
  return out.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function loadStrokes(ch){
  if (kvgCache[ch]) return Promise.resolve(kvgCache[ch]);
  if (!STROKES[ch]) STROKES[ch] = (async () => {
    for (const url of kvgUrls(ch)){
      try {
        const r = await fetch(url);
        if (!r.ok) continue;
        const ds = parseKvg(await r.text());
        if (ds.length){
          kvgCache[ch] = ds;
          try { localStorage.setItem('yomu.kvg', JSON.stringify(kvgCache)); } catch (e) {}
          return ds;
        }
      } catch (e) {}
    }
    delete STROKES[ch];
    throw new Error('brak wzoru');
  })();
  return STROKES[ch];
}
function strokeInfo(svgEl, ds){
  const tmp = document.createElementNS(NS, 'path');
  tmp.setAttribute('class', 's-tmp');
  svgEl.appendChild(tmp);
  const out = ds.map(d => {
    tmp.setAttribute('d', d);
    const L = tmp.getTotalLength(), a = tmp.getPointAtLength(0), b = tmp.getPointAtLength(L);
    return {L, a:[a.x, a.y], b:[b.x, b.y]};
  });
  tmp.remove();
  return out;
}
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStrokes(g, ds, {cls = 's-guide', animate = false, numbers = false, start = 0} = {}){
  g.innerHTML = '';
  const info = strokeInfo(g.ownerSVGElement, ds);
  let t = start;
  const anim = animate && !reduceMotion() && Element.prototype.animate;
  ds.forEach((d, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('class', cls);
    g.appendChild(p);
    const L = info[i].L;
    let delay = 0;
    if (anim){
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      const dur = 260 + L * 9;
      p.animate([{strokeDashoffset: L}, {strokeDashoffset: 0}], {duration: dur, delay: t, fill: 'forwards', easing: 'ease-in-out'});
      delay = t; t += dur + 200;
    }
    if (numbers){
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', info[i].a[0] - 4); tx.setAttribute('y', info[i].a[1] - 4);
      tx.setAttribute('class', 'snum'); tx.textContent = i + 1;
      if (anim){ tx.style.opacity = 0; tx.animate([{opacity: 0}, {opacity: 1}], {duration: 150, delay, fill: 'forwards'}); }
      g.appendChild(tx);
    }
  });
  info.end = t;
  return info;
}

const P = {id:null, phase:null, recent:[], retry:[], timer:null, opts:[], focus:null};
function pickNext(pool){
  P.retry.forEach(r => r.wait--);
  const i = P.retry.findIndex(r => r.wait <= 0 && pool.includes(r.id));
  let id;
  if (i >= 0){ id = P.retry[i].id; P.retry.splice(i, 1); }
  else id = pick(pool, S.stats, P.recent);
  P.recent.push(id);
  while (P.recent.length > Math.min(3, pool.length - 1)) P.recent.shift();
  return id;
}
function suggestion(){
  for (const sc of scripts()){
    const un = ROWS[sc].filter(r => S.unlocked[sc].includes(r.id));
    if (!un.length) continue;
    const ids = un.flatMap(r => r.items);
    const good = ids.filter(id => level(S.stats[id]) >= 2).length;
    if (good / ids.length >= 0.8){
      const nx = ROWS[sc].find(r => !S.unlocked[sc].includes(r.id));
      if (nx) return {sc, row:nx.id, pct:Math.round(good / ids.length * 100)};
    }
  }
  return null;
}
function startReview(){
  const ids = dueIds();
  if (!ids.length) return;
  P.focus = {kind:'review', left:new Set(ids), total:ids.length};
  P.retry = []; P.recent = [];
  S.view = 'cwicz'; save(); render();
}
function startMix(){
  const pairs = mixPairs().slice(0, 4);
  if (!pairs.length) return;
  P.focus = {kind:'mix', ids:[...new Set(pairs.flatMap(p => [p.id, p.as]))], n:0, total:15};
  P.retry = []; P.recent = [];
  S.view = 'cwicz'; save(); render();
}
function focusAfter(id, ok){
  const f = P.focus; if (!f) return;
  if (f.kind === 'review' && ok) f.left.delete(id);
  if (f.kind === 'mix') f.n++;
}
function focusDone(){
  const f = P.focus; if (!f) return false;
  if (f.kind === 'review' && !f.left.size){
    P.focus = null; toast('Powtórka zrobiona! Te znaki wrócą w swoim terminie.'); unlockAch('rev'); return true;
  }
  if (f.kind === 'mix' && f.n >= f.total){
    P.focus = null; toast('Ćwiczenie pomyłek skończone.'); unlockAch('mixfix'); return true;
  }
  return false;
}
function renderBanner(){
  const el = $('#banner'); if (!el) return;
  const notes = [];
  const f = P.focus;
  if (f){
    const txt = f.kind === 'review' ? `Powtórka: zostało <b>${f.left.size}</b> z ${f.total}.` : `Ćwiczenie pomyłek: <b>${f.n}</b> z ${f.total}.`;
    notes.push(`<div class="note"><span>${txt}</span><button class="btn small" id="fstop" type="button">Zakończ</button></div>`);
  } else {

    const mp = mixPairs();
    if (mp.length && mp[0].n >= 2) notes.push(`<div class="note"><span>Mylisz <span class="jp" lang="ja">${ITEMS[mp[0].id].ch}</span> z <span class="jp" lang="ja">${ITEMS[mp[0].as].ch}</span>${mp.length > 1 ? ' i nie tylko' : ''}.</span><button class="btn small" id="mixgo" type="button">Poćwicz</button></div>`);

    save(); planCheck(); toast(`Dodano rząd <span class="jp" lang="ja">${rowLabel(sc, row)}</span>`); renderBanner();
  };
}

function nextQ(){
  clearTimeout(P.timer);
  const card = $('#card'); if (!card || !$('#mnemo')) return;
  focusDone();
  renderBanner();
  card.className = 'card';
  $('#mnemo').innerHTML = '';
  const rev = S.mode === 'reverse', listen = S.mode === 'listen';
  const base = poolFor(scripts(), rev || listen);
  const pool = !P.focus ? base : P.focus.kind === 'review' ? [...P.focus.left] : P.focus.ids;
  const big = $('#big');
  big.className = 'big';
  $('#badge').hidden = true;
  $('#next').hidden = true;
  if (!pool.length){
    big.textContent = '';
    $('#hint').innerHTML = 'Nie masz odblokowanego żadnego rzędu w tym alfabecie. Dodaj go w zakładce <b>Postępy</b>.';
    if ($('#choices')) $('#choices').innerHTML = '';
    P.id = null; P.phase = null;
    return;
  }
  if (listen && !jaVoice){
    big.textContent = '';
    $('#choices').innerHTML = '';
    $('#hint').innerHTML = 'Ta przeglądarka nie ma japońskiego głosu, więc tryb Ze słuchu nie zadziała. Na telefonie i w Chrome zwykle działa od razu. Na Windowsie można dodać głos: <b>Ustawienia → Czas i język → Mowa → Dodaj głosy → japoński</b>.';
    P.id = null; P.phase = null;
    return;
  }
  const id = pickNext(pool);
  const it = ITEMS[id];
  P.id = id;
  const isNew = !S.intro[id] && !(S.stats[id] && S.stats[id].n);
  $('#badge').hidden = !isNew;
  if (S.mode === 'type'){
    big.textContent = it.ch;
    const inp = $('#in');
    inp.value = '';
    $('#skip').hidden = isNew;
    P.phase = isNew ? 'intro' : 'ask';
    $('#hint').innerHTML = isNew ? `Czyta się <b>${it.ro[0]}</b>. Wpisz to, żeby zapamiętać.` : '&nbsp;';
    if (isNew) showMnemo(id);
    if (document.activeElement !== inp) inp.focus({preventScroll:true});
    return;
  }
  const ch = $('#choices');
  if (isNew){
    P.phase = 'intro';
    ch.hidden = true;
    big.textContent = it.ch; big.setAttribute('lang', 'ja');
    $('#hint').innerHTML = `Nowy znak: <span class="jp" lang="ja">${it.ch}</span> czyta się <b>${it.ro[0]}</b>.`;
    showMnemo(id);
    const nb = $('#next'); nb.hidden = false; nb.textContent = 'Zapamiętane'; nb.focus({preventScroll:true});
    if (S.sound || listen) say(it.ch);
    return;
  }
  if (rev){ big.textContent = it.ro[0]; big.classList.add('roma'); big.removeAttribute('lang'); }
  else if (listen){
    big.classList.add('listen');
    big.innerHTML = `<button type="button" class="listen-big" id="replay" aria-label="Posłuchaj jeszcze raz">${SPEAK_ICON}</button>`;
    $('#replay').onclick = () => say(it.ch);
    setTimeout(() => say(it.ch), 60);
  }
  else { big.textContent = it.ch; big.setAttribute('lang','ja'); }
  ch.hidden = false;
  P.phase = 'ask';
  const dpool = poolFor([it.sc], rev || listen);
  const pers = Object.keys(S.mix[id] || {}).filter(x => ITEMS[x].sc === it.sc);
  const opts = [id, ...distractors(it, [...new Set([...dpool, ...pers])], Math.random, pers)];
  for (let i = opts.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  P.opts = opts;
  ch.innerHTML = opts.map((o, i) => (rev || listen)
    ? `<button type="button" data-i="${i}" lang="ja"><span class="n">${i+1}</span>${ITEMS[o].ch}</button>`
    : `<button type="button" data-i="${i}" class="roma"><span class="n">${i+1}</span>${ITEMS[o].ro[0]}</button>`).join('');
  $('#hint').innerHTML = '&nbsp;';
}
function advance(){
  if (P.phase === 'intro' && S.mode !== 'type'){ S.intro[P.id] = 1; todayStat().nw++; save(); planCheck(); }
  if (P.phase === 'wrong' || P.phase === 'intro' || P.phase === 'done'){ $('#next').textContent = 'Dalej'; nextQ(); }
}
function onEnter(){
  if (P.phase === 'wrong') nextQ();
  else if (P.phase === 'ask'){
    const v = $('#in').value.trim().toLowerCase();
    if (v) failType(ROMA[ITEMS[P.id].sc][v] || null, v);
  }
}
function onTypeInput(){
  const inp = $('#in'), it = ITEMS[P.id];
  if (!it || (P.phase !== 'ask' && P.phase !== 'intro')) return;
  const v = inp.value.trim().toLowerCase();
  if (!v) return;
  const card = $('#card');
  const j = judgeTyped(it, v);
  if (j.res === 'ok'){
    if (P.phase === 'intro'){ S.intro[it.id] = 1; todayStat().nw++; save(); planCheck(); }
    else { record(it.id, true); focusAfter(it.id, true); }
    P.phase = 'done';
    card.classList.add('ok');
    if (S.sound) say(it.ch);
    P.timer = setTimeout(nextQ, 320);
    return;
  }
  if (j.res === 'wrong'){
    if (P.phase === 'intro'){ shake(); inp.value = ''; return; }
    failType(j.as, v);
  }
}
function failType(as, typed){
  const it = ITEMS[P.id]; if (!it) return;
  record(it.id, false, as);
  focusAfter(it.id, false);
  P.retry.push({id: it.id, wait: 2});
  P.phase = 'wrong';
  const card = $('#card'); card.classList.add('no'); shake();
  const mixed = as && as !== it.id ? ` Wpisałeś <b>${esc(typed)}</b>, czyli <span class="jp" lang="ja">${ITEMS[as].ch}</span>.` : '';
  $('#hint').innerHTML = `To jest <b>${it.ro.join(' / ')}</b>.${mixed} Enter albo Dalej.`;
  showMnemo(it.id);
  $('#skip').hidden = true;
  $('#next').hidden = false;
  renderBanner();
  if (S.sound) say(it.ch);
}
function choose(i){
  if (P.phase !== 'ask') return;
  const it = ITEMS[P.id];
  const btns = document.querySelectorAll('#choices button');
  if (!btns[i]) return;
  const ok = P.opts[i] === P.id;
  const right = P.opts.indexOf(P.id);
  btns[right].classList.add('right');
  record(it.id, ok, ok ? null : P.opts[i]);
  focusAfter(it.id, ok);
  const listen = S.mode === 'listen';
  if (listen){
    const big = $('#big'); big.className = 'big'; big.textContent = it.ch;
    if (ok){ S.tally.listen++; todayStat().ls++; save(); checkAch(); planCheck(); }
  } else if (S.sound) say(it.ch);
  if (ok){
    P.phase = 'done';
    $('#card').classList.add('ok');
    P.timer = setTimeout(nextQ, listen ? 700 : 450);
  } else {
    btns[i].classList.add('wrong');
    P.retry.push({id: it.id, wait: 2});
    P.phase = 'wrong';
    $('#card').classList.add('no'); shake();
    const other = ITEMS[P.opts[i]];
    $('#hint').innerHTML = S.mode === 'reverse'
      ? `<b>${it.ro[0]}</b> to <span class="jp" lang="ja">${it.ch}</span>. Ten, który wybrałeś, czyta się <b>${other.ro[0]}</b>.`
      : listen
        ? `To było <span class="jp" lang="ja">${it.ch}</span> (<b>${it.ro[0]}</b>). Wybrałeś <span class="jp" lang="ja">${other.ch}</span> (${other.ro[0]}).`
        : `<span class="jp" lang="ja">${it.ch}</span> czyta się <b>${it.ro[0]}</b>.`;
    showMnemo(it.id);
    renderBanner();
    const nb = $('#next'); nb.hidden = false; nb.focus({preventScroll:true});
  }
}
function shake(){

}

const W = {word:null, phase:null, recent:[]};
function wordLists(){
  const out = [];
  scripts().forEach(sc => {
    if (sc === 'h'){
      WORDS_H.forEach(w => out.push({w:w[0], pl:w[1], egg:w[2], sc}));
      PHRASES_H.forEach(w => out.push({w:w[0], pl:w[1], sc, fr:true}));
    } else WORDS_K.forEach(w => out.push({w:w[0], pl:w[1], sc}));
  });
  return out;
}
function wordOk(w){
  return WT[w.w].every(u => u.k === 'ー' || isUnlocked(w.sc + ':' + (u.base || u.k)));
}
function missingRows(w){
  const set = new Set();
  WT[w.w].forEach(u => { if (u.k === 'ー') return; const id = w.sc + ':' + (u.base || u.k); if (!isUnlocked(id)) set.add(ITEMS[id].row); });
  return [...set];
}
function renderWords(m){
  m.innerHTML = `

      <div class="actions"><button type="button" class="btn" id="skip">Nie wiem</button><button type="button" class="btn primary" id="check">Sprawdź</button></div>
    </div>
    <p class="help" id="whelp"></p>`;
  bindScriptSeg(() => renderWords(m));
  $('#speak').onclick = () => { if (W.word) say(W.word.w); };
  $('#f').addEventListener('submit', e => { e.preventDefault(); wordSubmit(); });
  $('#check').onclick = () => { wordSubmit(); $('#in').focus(); };
  $('#skip').onclick = () => { if (W.phase === 'ask') wordFail(); $('#in').focus(); };
  W.recent = [];
  nextWord();
}
function nextWord(){
  const all = wordLists();
  const avail = all.filter(wordOk);
  const card = $('#card'); card.className = 'card';
  $('#in').value = '';
  $('#check').textContent = 'Sprawdź';
  $('#skip').hidden = false;
  $('#whelp').textContent = `Słowa i frazy z twoich znaków: ${avail.length} z ${all.length}. Wpisuj tak, jak piszesz kanę: ありがとう to arigatou (arigato też przejdzie).`;
  if (!avail.length){
    let best = null;
    all.forEach(w => { const mr = missingRows(w); if (!best || mr.length < best.mr.length) best = {w, mr}; });
    $('#big').textContent = '';
    $('#hint').innerHTML = best
      ? `Na razie żadne słowo nie składa się tylko z twoich znaków. Pierwsze pojawi się po dodaniu: ${best.mr.map(r => `<span class="jp" lang="ja">${rowLabel(best.w.sc, r)}</span>`).join(', ')}.`
      : 'Brak słów.';
    W.word = null; W.phase = null;
    return;
  }
  let cands = avail.filter(w => !W.recent.includes(w.w));
  if (!cands.length) cands = avail;
  const ws = cands.map(w => weight(S.wstats[w.w]));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0), pickW = cands[cands.length - 1];
  for (let i = 0; i < cands.length; i++){ r -= ws[i]; if (r <= 0){ pickW = cands[i]; break; } }
  W.word = pickW; W.phase = 'ask';
  W.recent.push(pickW.w); while (W.recent.length > Math.min(4, avail.length - 1)) W.recent.shift();
  $('#big').textContent = pickW.w;
  $('#hint').innerHTML = pickW.fr ? '<span class="tag">z anime</span>' : '&nbsp;';
  const inp = $('#in'); if (document.activeElement !== inp) inp.focus({preventScroll:true});
}
function wordRecord(ok){
  const st = S.wstats[W.word.w] || (S.wstats[W.word.w] = {n:0, ok:0, streak:0, iv:0, due:0});
  st.n++; if (ok){ st.ok++; st.streak++; } else st.streak = 0;
  srs(st, ok);
  todayStat().wd++;
  bumpDay(); save(); renderHeader(); checkAch(); planCheck();
}
function wordSubmit(){
  if (W.phase === 'done'){ nextWord(); return; }
  if (W.phase !== 'ask') return;
  const v = normalize($('#in').value);
  if (!v) return;
  if (v === 'miru' || v === 'yomu'){
    toast('<span class="jp" lang="ja">見る</span> miru to „patrzeć”, a <span class="jp" lang="ja">読む</span> yomu to „czytać”. Stąd nazwy.');
    unlockAch('names');
    return;
  }
  if (W.word.egg && v === W.word.egg){
    toast('Ohio to stan w USA. Po japońsku: <b>ohayou</b>. Spróbuj jeszcze raz.');
    unlockAch('ohio');
    $('#in').value = '';
    return;
  }
  const res = matchUnits(WT[W.word.w], v);
  if (res === FULL) wordDone(true);
  else wordFail();
}
function wordFail(){ wordDone(false); }
function wordDone(ok){
  wordRecord(ok);
  W.phase = 'done';
  const card = $('#card');
  card.classList.add(ok ? 'ok' : 'no');
  if (!ok) shake();
  $('#hint').innerHTML = `<b>${canon(WT[W.word.w])}</b> · ${esc(W.word.pl)}${W.word.fr ? '<span class="tag">z anime</span>' : ''}`;
  $('#check').textContent = 'Dalej';
  $('#skip').hidden = true;
  if (S.sound) say(W.word.w);
}

  bindPm(m);

function writeNext(){

function setWrite(ch, ro, sc){

  }).catch(() => {
    if (WR.ch !== ch) return;
    $('#hint').innerHTML = window.top !== window
      ? 'W podglądzie wzory kresek się nie wczytają. Sprawdzanie pisania działa na stronie YOMU w przeglądarce.'
      : 'Nie udało się pobrać wzoru kresek (przy pierwszym użyciu znaku potrzebny jest internet). Możesz ćwiczyć, ale bez sprawdzania.';
  });
}
function bindBoard(){
  const svg = $('#bsvg');
  const toPt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 109, (e.clientY - r.top) / r.height * 109]; };
  svg.addEventListener('pointerdown', e => {
    if (!WR.ch) return;
    e.preventDefault();
    if (WR.checked) writeReset();
    layer(svg, 'demo').innerHTML = '';
    try { svg.setPointerCapture(e.pointerId); } catch (er) {}
    WR.cur = [toPt(e)]; drawUser();
  });
  svg.addEventListener('pointermove', e => {
    if (!WR.cur) return;
    const p = toPt(e), l = WR.cur[WR.cur.length - 1];
    if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.8){ WR.cur.push(p); drawUser(); }
  });
  const up = () => { if (!WR.cur) return; WR.strokes.push(WR.cur); WR.cur = null; drawUser(); };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
}
function drawUser(res){
  const svg = $('#bsvg'); if (!svg) return;
  const g = layer(svg, 'user');
  const all = WR.cur ? [...WR.strokes, WR.cur] : WR.strokes;
  g.innerHTML = all.map((s, i) => {
    const d = s.length === 1 ? `M${s[0][0]} ${s[0][1]}l0.01 0` : 'M' + s.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    const c = res ? (res[i] === 'ok' ? ' ok' : ' bad') : '';
    return `<path class="s-user${c}" d="${d}"/>`;
  }).join('');
}
function writeReset(){
  WR.strokes = []; WR.cur = null; WR.checked = false;
  const svg = $('#bsvg'); if (!svg) return;
  $('#card').className = 'card';
  layer(svg, 'num').innerHTML = '';
  if (S.wmode === 'mem'){ layer(svg, 'guide').style.display = 'none'; if (!WR.ref) layer(svg, 'font').style.display = 'none'; }
  drawUser();

}
function writeDemo(){
  if (!WR.ref){ toast('Wzór kresek jeszcze się nie wczytał.'); return; }

function writeCheck(){
  if (!WR.ref){ toast('Bez wzoru kresek nie da się sprawdzić tego znaku.'); return; }
  if (!WR.strokes.length){ toast('Najpierw napisz znak na polu.'); return; }
  const res = judgeStrokes(WR.ends, WR.strokes);
  WR.checked = true;
  drawUser(res);
  const svg = $('#bsvg');
  layer(svg, 'guide').style.display = '';
  drawStrokes(layer(svg, 'num'), WR.ref, {cls:'s-tmp', numbers:true});
  const n = WR.ref.length, u = WR.strokes.length;
  const card = $('#card');
  if (res.every(r => r === 'ok')){
    card.className = 'card ok';
    $('#hint').innerHTML = `<b>Świetnie!</b> ${n} ${plural(n, 'kreska', 'kreski', 'kresek')}, wszystkie w dobrej kolejności i kierunku.`;
    S.tally.write++; todayStat().wr++; save(); checkAch(); planCheck();
    if (S.sound) say(WR.ch);
    return;
  }
  card.className = 'card no'; shake();
  const msgs = [];
  if (u !== n) msgs.push(`Ten znak ma ${n} ${plural(n, 'kreskę', 'kreski', 'kresek')}, a ty narysowałeś ${u}.`);
  res.forEach((r, i) => {
    if (r === 'dir') msgs.push(`Kreska ${i + 1} idzie w drugą stronę.`);

  });
  $('#hint').innerHTML = msgs.slice(0, 3).join(' ') + ' Numery pokazują, gdzie zaczyna się każda kreska.';
}

async function printSheet(){

      <div class="hint"><span class="jp" lang="ja" style="font-size:1.6em">${it.ch}</span> czyta się <b>${it.ro.join(' / ')}</b> · <span id="bk-n">…</span></div>
      <div class="actions">
        <button type="button" class="btn small" id="bk-prev" ${idx > 0 ? '' : 'disabled'} aria-label="Poprzedni znak">←</button>
        <button type="button" class="btn small" id="bk-play">Pokaż jeszcze raz</button>
        <button type="button" class="btn small" id="bk-next" ${idx >= 0 && idx < order.length - 1 ? '' : 'disabled'} aria-label="Następny znak">→</button>
      </div>
      <div class="bksec"><h3>Krok po kroku</h3><div class="steps" id="bk-steps"><span class="muted" style="font-size:13px">Wczytuję wzór kresek…</span></div></div>
      ${mnemo(id) ? `<div class="bksec"><h3>Jak zapamiętać</h3><div class="mnemo" style="text-align:left">${esc(mnemo(id))}</div></div>` : ''}
      <div class="bksec"><h3>Co to znaczy</h3>${mean}</div>
      <div class="actions">
        <button type="button" class="btn primary" id="bk-paper">${S.paper[id] ? `Napisane w zeszycie ✓ (${S.paper[id]}×)` : 'Napisałem w zeszycie'}</button>
        <button type="button" class="btn" id="bk-board">Ćwicz na ekranie</button>
      </div>
    </div>`;
  const go = d => { const n = order[idx + d]; if (!n) return; BK.sel = n; m.querySelectorAll('[data-bk]').forEach(x => x.classList.toggle('sel', x.dataset.bk === n)); renderBookDetail(m); };
  $('#bk-prev').onclick = () => go(-1);
  $('#bk-next').onclick = () => go(1);
  $('#bk-say').onclick = () => say(it.ch);
  let paperDone = false;
  $('#bk-paper').onclick = () => {
    if (paperDone) return;
    paperDone = true;
    S.paper[id] = (S.paper[id] || 0) + 1;
    todayStat().wr++;
    save(); planCheck();
    $('#bk-paper').textContent = `Napisane w zeszycie ✓ (${S.paper[id]}×)`;
    const cell = m.querySelector(`[data-bk="${id}"]`); if (cell) cell.classList.add('pp');
  };
  $('#bk-board').onclick = () => {
    if (chars.length === 1) WR.pending = id;
    else { WR.queue = chars.map(c => ({k: c, r: KMAP[c] ? KMAP[c][0] : ''})); WR.qlen = 0; WR.ch = null; }
    S.pmode = 'board'; save(); render();
  };
  // kreski: animacja na planszy + klatki krok po kroku
  chars.forEach((c, i) => { layer($('#bksvg' + i), 'font').textContent = c; });
  Promise.all(chars.map(c => loadStrokes(c))).then(all => {
    if (BK.sel !== id || !$('#bksvg0')) return;
    const n = all.reduce((a, ds) => a + ds.length, 0);
    $('#bk-n').textContent = `${n} ${plural(n, 'kreska', 'kreski', 'kresek')}`;
    $('#bk-steps').innerHTML = all.map((ds, i) => (i ? '<span class="stepplus">+</span>' : '') + stepsHtml(ds)).join('');
    const play = () => {
      let t = 0;
      all.forEach((ds, i) => {
        const svg = $('#bksvg' + i); if (!svg) return;
        layer(svg, 'font').textContent = '';
        drawStrokes(layer(svg, 'guide'), ds, {cls:'s-guide'});
        t = drawStrokes(layer(svg, 'demo'), ds, {cls:'s-demo', animate:true, numbers:true, start:t}).end;
      });
    };
    $('#bk-play').onclick = play;
    play();
  }).catch(() => {
    if (BK.sel !== id) return;
    $('#bk-n').textContent = 'bez wzoru kresek';
    $('#bk-steps').innerHTML = `<span class="muted" style="font-size:13px">${window.top !== window ? 'W podglądzie wzory kresek się nie wczytają. Działa na stronie YOMU.' : 'Nie udało się pobrać wzoru kresek. Przy pierwszym otwarciu znaku potrzebny jest internet.'}</span>`;
  });
}

  const single = [...it.ch].length === 1;
  const statLine = st && st.n ? `${labels[level(st)]} · ${st.n} ${plural(st.n, 'odpowiedź', 'odpowiedzi', 'odpowiedzi')}, trafnie ${Math.round(st.ok / st.n * 100)}% · ${dueText(st)}` : 'Jeszcze nie ćwiczony';

/* ---------- sprint ---------- */
const SP = {run:false, end:0, score:0, miss:0, iv:null, id:null, phase:null, recent:[]};
const SPRINT_MS = 60000;
function sprintKey(){ return 'sprint-' + S.script; }
function renderSprint(m){
  const best = S.best[sprintKey()] || 0;
  m.innerHTML = `
    <div class="controls">${scriptSeg()}</div>
    <div class="card" id="card">
      <div class="big roma" style="font-size:56px">60 s</div>
      <div class="hint">Wpisuj romaji jak najszybciej. Pomyłka pokazuje odpowiedź i zabiera chwilę.<br>Twój rekord tutaj: <b>${best}</b></div>
      <div class="actions"><button type="button" class="btn primary" id="go">Start</button></div>
    </div>
    <p class="help">Sprint bierze znaki z odblokowanych rzędów i też liczy się do postępów.</p>`;
  bindScriptSeg(() => renderSprint(m));
  $('#go').onclick = () => startSprint(m);
}
function startSprint(m){
  const pool = poolFor(scripts(), false);
  if (!pool.length){ toast('Najpierw odblokuj jakiś rząd w zakładce Postępy.'); return; }
  m.innerHTML = `
    <div class="sprint-bar"><span><small>Wynik</small><span class="score" id="sp-score">0</span></span><span><small>Zostało</small><span class="time" id="sp-time">60</span></span></div>
    <div class="timebar"><i id="sp-bar"></i></div>
    <div class="card" id="card">
      <div class="big" id="big" lang="ja"></div>
      <div class="hint" id="hint" aria-live="polite">&nbsp;</div>
      <form class="answer" id="f" autocomplete="off"><input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="romaji" aria-label="Jak się czyta ten znak"></form>
    </div>`;
  Object.assign(SP, {run:true, end:Date.now() + SPRINT_MS, score:0, miss:0, recent:[], pool});
  const inp = $('#in');
  inp.addEventListener('input', sprintInput);
  $('#f').addEventListener('submit', e => {
    e.preventDefault();
    const v = inp.value.trim().toLowerCase();
    if (SP.phase === 'ask' && v) sprintMiss(ROMA[ITEMS[SP.id].sc][v] || null);
  });
  clearInterval(SP.iv);
  SP.iv = setInterval(() => {
    const left = Math.max(0, SP.end - Date.now());
    $('#sp-time').textContent = Math.ceil(left / 1000);
    $('#sp-bar').style.width = (left / SPRINT_MS * 100) + '%';
    if (!left) endSprint(m);
  }, 100);
  sprintNext();
  inp.focus();
}
function sprintNext(){
  if (!SP.run) return;
  const id = pick(SP.pool, S.stats, SP.recent);
  SP.recent.push(id); while (SP.recent.length > Math.min(3, SP.pool.length - 1)) SP.recent.shift();
  SP.id = id; SP.phase = 'ask';
  $('#card').className = 'card';
  $('#big').textContent = ITEMS[id].ch;
  $('#hint').innerHTML = '&nbsp;';
  $('#in').value = '';
}
function sprintInput(){
  if (!SP.run || SP.phase !== 'ask') return;
  const it = ITEMS[SP.id];
  const v = $('#in').value.trim().toLowerCase();
  if (!v) return;
  const j = judgeTyped(it, v);
  if (j.res === 'ok'){
    SP.phase = 'done'; SP.score++;
    $('#sp-score').textContent = SP.score;
    record(it.id, true);
    $('#card').classList.add('ok');
    setTimeout(sprintNext, 120);
  } else if (j.res === 'wrong') sprintMiss(j.as);
}
function sprintMiss(as){
  const it = ITEMS[SP.id];
  SP.phase = 'wrong'; SP.miss++;
  record(it.id, false, as);
  $('#card').classList.add('no'); shake();
  $('#hint').innerHTML = `To <b>${it.ro[0]}</b>`;
  setTimeout(sprintNext, 800);
}
function endSprint(m){
  clearInterval(SP.iv); SP.run = false;
  const k = sprintKey();
  const prev = S.best[k] || 0;
  const rec = SP.score > prev;
  if (rec){ S.best[k] = SP.score; save(); }
  if (SP.score >= 20 && !SP.miss) unlockAch('perfect');
  checkAch();
  const total = SP.score + SP.miss;
  m.innerHTML = `
    <div class="controls">${scriptSeg()}</div>
    <div class="card ${rec ? 'ok' : ''}" id="card">
      <div class="hint">${rec ? (prev ? `Nowy rekord! Poprzedni: <b>${prev}</b>` : 'Pierwszy wynik zapisany jako rekord') : `Rekord: <b>${prev}</b>`}</div>
      <div class="result">${SP.score}</div>
      <div class="hint">dobrych odpowiedzi w minutę${total ? ` · trafność ${Math.round(SP.score / total * 100)}%` : ''}</div>
      <div class="actions"><button type="button" class="btn primary" id="go">Jeszcze raz</button></div>
    </div>`;
  bindScriptSeg(() => renderSprint(m));
  $('#go').onclick = () => startSprint(m);
  $('#go').focus();
}

    <div class="legend"><span><i style="background:var(--learn)"></i>w nauce</span><span><i style="background:var(--known)"></i>znane (3 dobrze z rzędu)</span><span><i style="background:var(--good)"></i>opanowane (6 z rzędu, 85% trafień)</span></div>
    <p class="help" style="text-align:left">Zaznaczone rzędy trafiają do ćwiczeń. Stuknij znak, żeby zobaczyć skojarzenie i kolejność kresek. Znane słowa: <b>${words}</b>.</p>

  const r0 = $('#reset0'); if (r0) r0.onclick = () => { confirmReset = false; renderTable(m); };
  const r2 = $('#reset2'); if (r2) r2.onclick = () => {

/* ---------- sakura (sekret) ---------- */
function renderPetals(){
  const box = $('#petals');
  if (!S.sakura){ box.innerHTML = ''; return; }
  let h = '';
  for (let i = 0; i < 18; i++){
    const left = Math.random() * 100, dur = 9 + Math.random() * 9, delay = -Math.random() * 18, dx = (Math.random() * 40 - 10).toFixed(0);
    const sc = (0.6 + Math.random() * 0.8).toFixed(2);
    h += `<span class="petal" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;--dx:${dx}vw;scale:${sc}"></span>`;
  }
  box.innerHTML = h;
}
function toggleSakura(){
  S.sakura = !S.sakura; save(); renderPetals();
  unlockAch('konami');
  toast(S.sakura ? '<span class="jp" lang="ja">桜</span> Sakura włączona. Ten sam sekret ją wyłącza.' : 'Sakura wyłączona.');
}
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kpos = 0;
function konami(e){
  const k = e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;
  kpos = k === KONAMI[kpos] ? kpos + 1 : (k === KONAMI[0] ? 1 : 0);
  if (kpos === KONAMI.length){ kpos = 0; toggleSakura(); }
}
let logoTaps = [];
$('#logo').addEventListener('click', () => {
  const now = Date.now();
  logoTaps = logoTaps.filter(t => now - t < 3000); logoTaps.push(now);
  if (logoTaps.length >= 7){ logoTaps = []; toggleSakura(); }
});

/* ---------- klawiatura ---------- */
document.addEventListener('keydown', e => {
  konami(e);
  if (e.target.matches('input, textarea') || $('#dlg').open) return;
  if (S.view === 'cwicz' && S.mode !== 'type'){
    if (/^[1-4]$/.test(e.key)){ choose(+e.key - 1); e.preventDefault(); }
    else if ((e.key === 'p' || e.key === 'P') && S.mode === 'listen' && P.id){ say(ITEMS[P.id].ch); e.preventDefault(); }
    else if (e.key === 'Enter' && (P.phase === 'wrong' || P.phase === 'intro') && document.activeElement !== $('#next')){ advance(); e.preventDefault(); }
  }
});

/* ---------- start ---------- */
function render(){
  clearTimeout(P.timer); clearInterval(SP.iv); SP.run = false;
  confirmReset = false;
  renderHeader(); renderTabs();
  const m = $('#main');
  if (S.view === 'slowa') renderWords(m);
  else if (S.view === 'pisz') renderWrite(m);
  else if (S.view === 'sprint') renderSprint(m);
  else if (S.view === 'tabela') renderTable(m);
  else { S.view = 'cwicz'; renderPractice(m); }
}
if ('speechSynthesis' in window){ initVoice(); try { speechSynthesis.onvoiceschanged = initVoice; } catch (e) {} }
render();
renderPetals();
checkAch();
if (SY.code) syncNow({rerender: true});
// tryb offline: tylko gdy strona jest otwarta bezpośrednio (np. GitHub Pages), nie w podglądzie
if ('serviceWorker' in navigator && window.top === window && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
